<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
</head>
<body class="home-page">
    <div class="home-wrapper">
        <div class="book-cover-frame">
            <div class="frame-ornament top-left"></div>
            <div class="frame-ornament top-right"></div>
            <div class="frame-ornament bottom-left"></div>
            <div class="frame-ornament bottom-right"></div>
            
            <div class="home-content">
                <div class="icon-container">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="library-icon">
                        <path fill="currentColor" d="M6 2h12c1.1 0 2 .9 2 2v16c0 1.1-.9 2-2 2H6c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2zm0 2v16h12V4H6zm2 2h8v2H8V6zm0 4h8v2H8v-2zm0 4h5v2H8v-2z"/>
                    </svg>
                </div>
                
                <h1 class="main-title">LIBRARY</h1>
                <p class="subtitle">A Collection of Literary Treasures</p>
                
                <div class="buttons-book">
                    <a href="book-form.html" class="button-link">
                        <button class="library-tag-btn add-btn">
                            <span class="btn-icon">✎</span>
                            <span class="btn-text">Add a Book</span>
                        </button>
                    </a>
                    
                    <a href="storage.html" class="button-link">
                        <button class="library-tag-btn view-btn">
                            <span class="btn-icon">◈</span>
                            <span class="btn-text">View Collection</span>
                        </button>
                    </a>
                </div>
            </div>
        </div>
    </div>

</html>
