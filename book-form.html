<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&family=Caveat+Brush&family=Momo+Trust+Display&family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
    <script src="script.js" defer></script>
</head>
<body class="add-book-page">
    <div class="main-wrapper">
        <div class="form-wrapper">
        
            <form action="/script.js" method="POST">
            <div class="form-title">
              <h2 class="">Add your book</h2>
              <p>
                Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do
                eiusmod tempor incididunt.
              </p>
            </div>
      
            <div class="input-flex">
              <div>
                <label for="title" class="form-label">
                  Title
                </label>
                <input
                  type="text"
                  name="title"
                  id="title"
                  class="form-input"
                />
              </div>
            </div>
      
            <div class="input-flex">
              <div>
                <label for="author" class="form-label"> Author </label>
                <input
                  type="text"
                  name="author"
                  id="author"
                  class="form-input"
                />
              </div>
            </div>
      
            <div class="input-flex">
                <div class="mb-2">
                    <label for="pages" class="form-label"> Pages </label>
                    <input
                      type="number"
                      name="pages"
                      id="pages"
                      class="form-input"
                      min="0"
                      max="5000"
                    />
                </div>
                <div class="input-flex">
                    <div>
                        <label for="year" class="form-label"> Published Year </label>
                        <input
                        type="number"
                        name="year"
                        id="year"
                        class="form-input"
                        min="1000"
                        max="2100"
                        />
                    </div>
                </div>
            </div>
            <div>
                <p class="form-label">Have you read the book?</p>
                <label>
                  <input type="radio" name="choice-radio">
                  Yes
                </label>
                <label>
                  <input type="radio" name="choice-radio">
                  No
                </label>
            </div>


            <button class="btn">Add</button>
          </form>
        </div>
      </div>
</body>
</html>
